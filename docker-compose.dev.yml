# Development docker-compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      target: development
    volumes:
      # Mount source code for hot reload
      - ./backend:/app:rw
    environment:
      - DEBUG=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    # Vite dev server with hot reload instead of nginx.
    # Open http://localhost:3000 ; runtime config comes from frontend/public/config.js.
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app:rw
      - /app/node_modules
      - ./storage/map:/app/public/map:ro
    environment:
      - NODE_ENV=development
    read_only: false
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 3000"
